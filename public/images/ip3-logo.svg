<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 280 44" fill="none">
  <!-- Brand Emblem Container -->
  <g id="logo-emblem">
    <!-- Gradient Definitions -->
    <defs>
      <linearGradient id="emblem-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ff7e67"/>
        <stop offset="100%" stop-color="#e05e47"/>
      </linearGradient>
      <linearGradient id="leaf-grad" x1="12" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#34d399"/>
        <stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <linearGradient id="gold-glow" x1="0" y1="0" x2="280" y2="48" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ff7e67" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Subtle Backplate Glow -->
    <rect x="0" y="4" width="40" height="40" rx="12" fill="url(#gold-glow)" />

    <!-- Main Emblem Tile -->
    <rect x="2" y="4" width="40" height="40" rx="11" fill="#081424" stroke="#ff7e67" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Precision Geo Agriscience Grid & Seed Network -->
    <path d="M12 24 L22 14 L32 24 L22 34 Z" stroke="#ff7e67" stroke-width="1.2" stroke-dasharray="2 1.5" stroke-opacity="0.4" fill="none"/>
    <path d="M14 24 Q 22 13 30 24 Q 22 35 14 24 Z" fill="url(#leaf-grad)" fill-opacity="0.25" stroke="url(#leaf-grad)" stroke-width="1.2"/>
    <path d="M22 15 L22 33" stroke="#34d399" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="22" cy="14" r="2" fill="#ff7e67"/>
    <circle cx="22" cy="24" r="2.2" fill="#ffffff"/>
    <circle cx="22" cy="34" r="2" fill="#10b981"/>
    <circle cx="12" cy="24" r="1.6" fill="#ff7e67"/>
    <circle cx="32" cy="24" r="1.6" fill="#10b981"/>
  </g>

  <!-- Brand Typography Lockup -->
  <g id="logo-text" transform="translate(50, 0)">
    <!-- Primary Name: IP3 AGRISCIENCE -->
    <text x="0" y="23" font-family="'Archivo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" letter-spacing="0.04em" fill="#f8fafc">
      <tspan fill="#ff7e67">IP3</tspan>
      <tspan dx="4" fill="#f8fafc">AGRISCIENCE</tspan>
    </text>

    <!-- Subtitle / Tagline: PRECISION RESEARCH FARM -->
    <text x="0" y="36" font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace" font-weight="700" font-size="8.5" letter-spacing="0.14em" fill="#94a3b8">
      PRECISION RESEARCH FARM
    </text>
  </g>
</svg>
